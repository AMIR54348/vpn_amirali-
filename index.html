<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Panel</title>
    <style>
        body {
            background-color: #f0f4f8;
            background-image: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            font-family: Tahoma, sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            color: #0284c7;
            text-shadow: 0 0 10px rgba(2, 132, 199, 0.2);
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            color: #db2777;
            font-size: 13px;
            margin-bottom: 30px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px solid #cbd5e1;
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #1e293b;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
        }
        .card:hover {
            border-color: #0284c7;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.25);
            background: #ffffff;
        }
        .card span {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
            color: #0284c7;
        }
        .full-width {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <h1>VPN PANEL</h1>
    <p>✨ سرویس مورد نظر خود را انتخاب کنید ✨</p>

    <div class="container">
        <!-- دکمه V2Ray -->
        <a href="لینک_کانفیگ_یا_بات_شما" class="card">
            <div style="font-size: 28px;">⚡</div>
            <span>V2RAY</span>
        </a>

        <!-- دکمه OpenVPN -->
        <a href="لینک_کانفیگ_یا_بات_شما" class="card">
            <div style="font-size: 28px;">🔒</div>
            <span>OpenVPN</span>
        </a>

        <!-- دکمه DNS -->
        <a href="لینک_کانفیگ_یا_بات_شما" class="card">
            <div style="font-size: 28px;">🌐</div>
            <span>DNS</span>
        </a>

        <!-- دکمه WireGuard Gaming -->
        <a href="لینک_کانفیگ_یا_بات_شما" class="card">
            <div style="font-size: 28px;">🐉</div>
            <span>wireGuard Gaming</span>
        </a>

        <!-- دکمه WireGuard Web -->
        <a href="لینک_کانفیگ_یا_بات_شما" class="card full-width">
            <div style="font-size: 28px;">🔥</div>
            <span>WireGuard WEB</span>
        </a>
    </div>

</body>
</html>
